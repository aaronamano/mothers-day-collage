<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You, Mom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose-deep: #8B1A2B;
    --rose: #C2185B;
    --blush: #F8E8EE;
    --gold: #D4A574;
    --gold-light: #F0D5B0;
    --cream: #FFF8F5;
    --charcoal: #2D1B1E;
    --petal-pink: #F5D6E0;
    --dusty-rose: #D4A0B0;
    --rose-soft: #E8B4C8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: #1a1012;
    color: var(--cream);
    overflow-x: hidden;
    min-height: 100vh;
  }

  .noise {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.025;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  .loading-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1012;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.2s ease;
  }

  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-title {
    font-family: 'Tangerine', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem);
    color: var(--rose-soft);
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeIn 1s ease 0.2s forwards;
  }

  .loading-bar-track {
    width: 200px; height: 1px;
    background: rgba(212, 165, 116, 0.15);
    border-radius: 1px;
    overflow: hidden;
    opacity: 0;
    animation: fadeIn 1s ease 0.6s forwards;
  }

  .loading-bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, var(--dusty-rose), var(--gold));
    border-radius: 1px;
    transition: width 0.3s ease;
  }

  .loading-count {
    font-size: 0.8rem;
    color: var(--dusty-rose);
    margin-top: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease 0.8s forwards;
  }

  .scene {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    perspective: 1000px;
    perspective-origin: 50% 50%;
    z-index: 0;
    overflow: hidden;
  }

  .stage {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    will-change: transform;
  }

  .photo-card {
    position: absolute;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
    will-change: transform;
  }

  .photo-card img {
    display: block;
    border-radius: 3px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    transition: box-shadow 0.4s ease;
    pointer-events: none;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-card .frame {
    position: absolute;
    inset: -4px;
    border: 1px solid rgba(212, 165, 116, 0.15);
    border-radius: 4px;
    pointer-events: none;
    transition: border-color 0.4s ease;
  }

  .photo-card .glow {
    position: absolute;
    inset: -10px;
    border-radius: 6px;
    background: radial-gradient(ellipse, rgba(255, 107, 138, 0.15), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .photo-card:hover .glow { opacity: 1; }
  .photo-card:hover .frame { border-color: rgba(212, 165, 116, 0.4); }
  .photo-card:hover img { box-shadow: 0 8px 50px rgba(255, 107, 138, 0.2); }

  .photo-card .label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 30px 12px 10px;
    background: linear-gradient(transparent, rgba(26, 16, 18, 0.7));
    color: var(--cream);
    font-size: 0.75rem;
    font-style: italic;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.4s ease;
    pointer-events: none;
    border-radius: 0 0 3px 3px;
  }

  .photo-card:hover .label {
    opacity: 1;
    transform: translateY(0);
  }

  .video-backdrop {
    position: absolute;
    border: 1.5px solid rgba(212, 165, 116, 0.15);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2s ease, border-color 0.4s ease;
    box-shadow: 0 0 80px rgba(139, 26, 43, 0.08), 0 0 160px rgba(212, 165, 116, 0.05);
    cursor: pointer;
    transform-style: preserve-3d;
  }

  .video-backdrop:hover {
    border-color: rgba(212, 165, 116, 0.35);
  }

  .video-backdrop video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 3px;
    opacity: 0.35;
    transform: scaleX(-1);
  }

  .overlay {
    position: relative;
    z-index: 2;
    pointer-events: none;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 28px 20px 16px;
    background: linear-gradient(180deg, rgba(26,16,18,0.7) 0%, transparent 100%);
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .header.visible { opacity: 1; }

  .header-ornament {
    font-size: 14px;
    color: var(--dusty-rose);
    letter-spacing: 8px;
    margin-bottom: 4px;
  }

  .header h1 {
    font-family: 'Tangerine', cursive;
    font-size: clamp(2rem, 4.5vw, 3.6rem);
    font-weight: 700;
    color: var(--rose-soft);
    line-height: 1.1;
    text-shadow: 0 2px 20px rgba(139, 26, 43, 0.3);
  }

  .header .subtitle {
    font-size: clamp(0.65rem, 1.1vw, 0.85rem);
    font-weight: 300;
    font-style: italic;
    color: var(--dusty-rose);
    margin-top: 4px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    padding: 16px 20px 24px;
    background: linear-gradient(0deg, rgba(26,16,18,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .footer.visible { opacity: 1; }

  .footer .signature {
    font-family: 'Tangerine', cursive;
    font-size: 1.3rem;
    color: var(--rose-soft);
  }

  .footer .date {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--dusty-rose);
    margin-top: 2px;
    opacity: 0.6;
  }

  .footer .hint {
    font-size: 0.6rem;
    font-style: italic;
    color: var(--dusty-rose);
    margin-top: 6px;
    opacity: 0.35;
    letter-spacing: 1px;
  }

  .scroll-indicator {
    position: fixed;
    bottom: 66px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .scroll-indicator.visible { opacity: 0.35; }

  .scroll-indicator span {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--dusty-rose);
  }

  .scroll-mouse {
    width: 18px; height: 28px;
    border: 1px solid var(--dusty-rose);
    border-radius: 9px;
    position: relative;
    opacity: 0.6;
  }

  .scroll-mouse::after {
    content: '';
    position: absolute;
    top: 5px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 5px;
    background: var(--dusty-rose);
    border-radius: 1px;
    animation: scrollDot 2s ease-in-out infinite;
  }

  @keyframes scrollDot {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    50% { transform: translateX(-50%) translateY(7px); opacity: 0.3; }
  }

  /* ===== LIGHTBOX ===== */
  .lightbox {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 6, 7, 0.92);
    backdrop-filter: blur(20px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    cursor: pointer;
  }

  .lightbox.active { opacity: 1; pointer-events: all; }

  .lightbox-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox img {
    max-width: 80vw;
    max-height: 80vh;
    border-radius: 4px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    transform: scale(0.92);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    border: 1px solid rgba(212, 165, 116, 0.15);
  }

  .lightbox.active img { transform: scale(1); }

  .lightbox-video {
    max-width: 80vw;
    max-height: 80vh;
    border-radius: 4px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    border: 1px solid rgba(212, 165, 116, 0.15);
    display: none;
  }

  .lightbox.video-mode .lightbox-arrow { display: none; }

  .lightbox-close {
    position: absolute;
    top: -48px;
    right: -8px;
    width: 36px; height: 36px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-size: 26px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .lightbox-close:hover { color: white; }

  .lightbox-label {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--dusty-rose);
    font-style: italic;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .lightbox-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.4);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
  }

  .lightbox-arrow:hover {
    background: rgba(255,255,255,0.08);
    color: white;
    border-color: rgba(255,255,255,0.2);
  }

  .lightbox-arrow.prev { left: -56px; }
  .lightbox-arrow.next { right: -56px; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 700px) {
    .header { padding: 18px 16px 10px; }
    .header-ornament { font-size: 11px; letter-spacing: 5px; }
    .header .subtitle { font-size: 0.6rem; }
    .footer { padding: 10px 16px 14px; }
    .footer .signature { font-size: 1rem; }
    .footer .hint { display: none; }
    .lightbox img { max-width: 92vw; max-height: 70vh; }
    .lightbox-arrow { display: none; }
    .lightbox-close { top: 16px; right: 16px; }
    .lightbox-label { bottom: -28px; font-size: 0.7rem; }
    .photo-card .label { opacity: 1; transform: translateY(0); padding: 20px 8px 8px; font-size: 0.65rem; }
  }
</style>
</head>
<body>

<div class="noise"></div>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-title">For You, Mom</div>
  <div class="loading-bar-track">
    <div class="loading-bar-fill" id="loadingBarFill"></div>
  </div>
  <div class="loading-count" id="loadingCount">Loading memories...</div>
</div>

<div class="scene" id="scene">
  <div class="stage" id="stage"></div>
</div>

<div class="overlay">
  <header class="header" id="header">
    <div class="header-ornament">&#x2661; &bull; &#x2661; &bull; &#x2661;</div>
    <h1>For You, Mom</h1>
    <div class="subtitle">Our memories, in a different light</div>
  </header>

  <footer class="footer" id="footer">
    <div class="signature">Happy Mother's Day</div>
    <div class="date">May 10 &bull; 2026</div>
    <div class="hint">&#8592; drag to explore &bull; click any photo</div>
  </footer>

  <div class="scroll-indicator" id="scrollIndicator">
    <div class="scroll-mouse"></div>
    <span>Explore</span>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose">&#10005;</button>
    <button class="lightbox-arrow prev" id="lbPrev">&#8592;</button>
    <img id="lightboxImg" src="" alt="">
    <video id="lightboxVideo" class="lightbox-video" muted loop playsinline controls></video>
    <button class="lightbox-arrow next" id="lbNext">&#8594;</button>
    <div class="lightbox-label" id="lightboxLabel"></div>
  </div>
</div>

<script>
  const IMAGES = [
    { file: 'assets/img-1.jpeg', label: 'A moment to treasure' },
    { file: 'assets/img-2.jpeg', label: 'Beautiful you' },
    { file: 'assets/img-3.JPG', label: 'Radiant smile' },
    { file: 'assets/img-4.JPG', label: 'Pure joy' },
    { file: 'assets/img-5.JPG', label: 'Everlasting love' },
    { file: 'assets/img-6.JPG', label: 'Warm embrace' },
    { file: 'assets/img-7.JPG', label: 'You light up our world' },
    { file: 'assets/img-8.JPG', label: 'Our favorite memories' },
    { file: 'assets/img-9.JPG', label: 'Endless grace' },
    { file: 'assets/img-10.JPG', label: 'Shining bright' },
    { file: 'assets/img-11.JPG', label: 'Strength & beauty' },
    { file: 'assets/img-12.JPG', label: 'Heart full of love' },
    { file: 'assets/img-13.JPG', label: 'Thank you for everything' },
    { file: 'assets/img-14.JPG', label: 'Simply the best' },
  ];

  // ===== DOM REFS =====
  const scene = document.getElementById('scene');
  const stage = document.getElementById('stage');
  const loadingScreen = document.getElementById('loadingScreen');
  const loadingBarFill = document.getElementById('loadingBarFill');
  const loadingCount = document.getElementById('loadingCount');
  const header = document.getElementById('header');
  const footer = document.getElementById('footer');
  const scrollIndicator = document.getElementById('scrollIndicator');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxVideo = document.getElementById('lightboxVideo');
  const lightboxLabel = document.getElementById('lightboxLabel');
  const lightboxClose = document.getElementById('lightboxClose');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');

  // ===== 3D CSS GALLERY =====
  const RADIUS = 380;
  const ARC = Math.PI * 1.0;
  const CARD_BASE_WIDTH = 200;
  const CARD_BASE_HEIGHT = 160;

  let currentAngleX = -0.05;
  let currentAngleY = 0;
  let targetAngleX = -0.05;
  let targetAngleY = 0;
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;
  let autoRotate = true;
  let autoRotateTimer = null;
  let loadedCount = 0;
  const cards = [];
  let currentLightboxIndex = 0;

  function buildGallery() {
    const total = IMAGES.length;

    IMAGES.forEach((imgData, i) => {
      const t = i / (total - 1);
      const angle = -ARC / 2 + t * ARC;

      const x = RADIUS * Math.sin(angle);
      const z = RADIUS * Math.cos(angle) - RADIUS * 0.15;
      const y = 90 * Math.sin(t * Math.PI * 2.5) + 20 * Math.cos(t * Math.PI * 4);

      const aspect = 1;
      const baseH = CARD_BASE_HEIGHT;
      const baseW = CARD_BASE_WIDTH;

      const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.width = baseW + 'px';
      card.style.height = baseH + 'px';
      card.style.left = 'calc(50% - ' + (baseW / 2) + 'px)';
      card.style.top = 'calc(50% - ' + (baseH / 2) + 'px)';
      card.style.opacity = '0';
      card.style.transition = 'opacity 0.6s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease';
      card.dataset.index = i;

      const img = document.createElement('img');
      img.src = imgData.file;
      img.alt = imgData.label;
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';

      img.onload = () => {
        const actualAspect = img.naturalWidth / img.naturalHeight;
        const h = baseH;
        const w = h * actualAspect;
        card.style.width = w + 'px';
        card.style.height = h + 'px';
        card.style.left = 'calc(50% - ' + (w / 2) + 'px)';
        card.style.top = 'calc(50% - ' + (h / 2) + 'px)';
        card.dataset.w = w;
        card.dataset.h = h;
        applyCardTransform(card, angle, x, y, z, i);
        loadedCount++;
        updateProgress();
      };

      img.onerror = () => {
        loadedCount++;
        updateProgress();
      };

      card.appendChild(img);

      const frame = document.createElement('div');
      frame.className = 'frame';
      card.appendChild(frame);

      const glow = document.createElement('div');
      glow.className = 'glow';
      card.appendChild(glow);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = imgData.label;
      card.appendChild(label);

      card.userData = {
        angle: angle,
        x: x,
        y: y,
        z: z,
        baseY: y,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.2,
        amp: 3 + Math.random() * 3,
      };

      stage.appendChild(card);
      cards.push(card);

      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.index);
        openLightbox(idx);
      });
    });
  }

  function applyCardTransform(card, angle, x, y, z, index) {
    const total = IMAGES.length;
    const t = index / (total - 1);
    const rotateY = -angle * 0.8;
    const rotateX = 0.02 * Math.sin(t * Math.PI * 3);

    card.style.transform =
      'translate3d(' + x + 'px, ' + y + 'px, ' + z + 'px) ' +
      'rotateY(' + rotateY + 'rad) ' +
      'rotateX(' + rotateX + 'rad)';
    card.style.opacity = '1';
  }

  function updateStage() {
    const rx = targetAngleX;
    const ry = targetAngleY;
    const degX = rx * (180 / Math.PI);
    const degY = ry * (180 / Math.PI);
    stage.style.transform = 'rotateX(' + degX + 'deg) rotateY(' + degY + 'deg)';
  }

  function updateProgress() {
    const pct = Math.round((loadedCount / IMAGES.length) * 100);
    loadingBarFill.style.width = pct + '%';
    loadingCount.textContent = 'Loading memories... ' + pct + '%';

    if (loadedCount >= IMAGES.length) {
      loadingBarFill.style.width = '100%';
      loadingCount.textContent = 'Ready';
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        header.classList.add('visible');
        footer.classList.add('visible');
        scrollIndicator.classList.add('visible');
        setTimeout(() => scrollIndicator.classList.remove('visible'), 5000);
      }, 400);
    }
  }

  // ===== FLOATING ANIMATION =====
  let floatTime = 0;

  function animateFloating() {
    floatTime += 0.016;
    cards.forEach((card) => {
      const ud = card.userData;
      const offset = Math.sin(floatTime * ud.speed + ud.phase) * ud.amp;
      const total = IMAGES.length;
      const t = parseInt(card.dataset.index) / (total - 1);
      const angle = -ARC / 2 + t * ARC;
      const x = RADIUS * Math.sin(angle);
      const z = RADIUS * Math.cos(angle) - RADIUS * 0.15;
      const rotateY = -angle * 0.8;
      const rotateX = 0.02 * Math.sin(t * Math.PI * 3);
      card.style.transform =
        'translate3d(' + x + 'px, ' + (ud.baseY + offset) + 'px, ' + z + 'px) ' +
        'rotateY(' + rotateY + 'rad) ' +
        'rotateX(' + rotateX + 'rad)';
    });
    requestAnimationFrame(animateFloating);
  }

  // ===== MOUSE/TOUCH DRAG =====
  function getPos(e) {
    if (e.touches) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function onStart(e) {
    isDragging = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    autoRotate = false;
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
  }

  function onMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const pos = getPos(e);
    const dx = pos.x - lastX;
    const dy = pos.y - lastY;
    targetAngleY += dx * 0.005;
    targetAngleX += dy * 0.003;
    targetAngleX = Math.max(-0.4, Math.min(0.3, targetAngleX));
    lastX = pos.x;
    lastY = pos.y;
  }

  function onEnd() {
    isDragging = false;
    autoRotateTimer = setTimeout(() => {
      if (!lightbox.classList.contains('active')) {
        autoRotate = true;
      }
    }, 3000);
  }

  scene.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  scene.addEventListener('touchstart', onStart, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);

  // ===== AUTO ROTATE LOOP =====
  function autoRotateLoop() {
    if (autoRotate && !isDragging) {
      targetAngleY += 0.002;
    }
    // smooth interpolation
    currentAngleX += (targetAngleX - currentAngleX) * 0.08;
    currentAngleY += (targetAngleY - currentAngleY) * 0.08;
    updateStage();
    requestAnimationFrame(autoRotateLoop);
  }

  // ===== LIGHTBOX =====
  function openLightbox(index) {
    currentLightboxIndex = index;
    const imgData = IMAGES[index];
    lightboxImg.src = imgData.file;
    lightboxImg.alt = imgData.label;
    lightboxLabel.textContent = imgData.label;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
    autoRotate = false;
  }

  function openVideoLightbox() {
    lightboxImg.style.display = 'none';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = 'assets/mothers-day-ai-slop-collage.mp4';
    lightboxVideo.play();
    lightboxLabel.textContent = 'Our story in motion';
    lightbox.classList.add('active', 'video-mode');
    document.body.style.overflow = 'hidden';
    autoRotate = false;
  }

  function closeLightboxFn() {
    lightbox.classList.remove('active', 'video-mode');
    lightboxVideo.pause();
    lightboxVideo.style.display = 'none';
    lightboxImg.style.display = '';
    document.body.style.overflow = '';
    autoRotate = true;
  }

  function navigateLightbox(dir) {
    currentLightboxIndex = (currentLightboxIndex + dir + IMAGES.length) % IMAGES.length;
    const imgData = IMAGES[currentLightboxIndex];
    lightboxImg.src = imgData.file;
    lightboxImg.alt = imgData.label;
    lightboxLabel.textContent = imgData.label;
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target === lightbox.querySelector('.lightbox-inner')) {
      closeLightboxFn();
    }
  });

  lightboxClose.addEventListener('click', closeLightboxFn);
  lbPrev.addEventListener('click', (e) => { if (lightbox.classList.contains('video-mode')) return; e.stopPropagation(); navigateLightbox(-1); });
  lbNext.addEventListener('click', (e) => { if (lightbox.classList.contains('video-mode')) return; e.stopPropagation(); navigateLightbox(1); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightboxFn();
    if (!lightbox.classList.contains('video-mode')) {
      if (e.key === 'ArrowRight') navigateLightbox(1);
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
    }
  });

  // ===== VIDEO BACKDROP =====
  function buildVideoFrame() {
    const frame = document.createElement('div');
    frame.className = 'video-backdrop';

    const video = document.createElement('video');
    video.src = 'assets/mothers-day-ai-slop-collage.mp4';
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.autoplay = true;
    video.preload = 'metadata';

    frame.appendChild(video);

    video.onloadedmetadata = () => {
      const aspect = video.videoWidth / video.videoHeight;
      const maxW = Math.min(window.innerWidth * 0.6, 520);
      const w = maxW;
      const h = w / aspect;

      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      frame.style.left = 'calc(50% - ' + (w / 2) + 'px)';
      frame.style.top = 'calc(50% - ' + (h / 2) + 'px)';
      frame.style.transform = 'translate3d(0px, 20px, -220px)';
      frame.style.opacity = '1';
    };

    stage.appendChild(frame);

    frame.addEventListener('click', (e) => {
      e.stopPropagation();
      openVideoLightbox();
    });
  }

  // ===== RESIZE =====
  window.addEventListener('resize', () => {
    // Recalculate positions based on viewport
  });

  // ===== INIT =====
  buildGallery();
  buildVideoFrame();
  animateFloating();
  autoRotateLoop();

  console.log('🌸 For You, Mom — CSS 3D Gallery ready');
</script>
</body>
</html>
